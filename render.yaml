# Render Blueprint for the MeetMemo API (the Chrome extension itself is not hosted).
# Secrets are never stored here: variables marked `sync: false` are entered in the Render
# dashboard (Blueprint prompts for them on first deploy).
# Moving to DigitalOcean App Platform / any Node host needs no code change: same root
# directory, build command, run command, health check and environment variables.
services:
  - type: web
    name: meetmemo-api
    runtime: node
    rootDir: backend
    plan: free            # free instances sleep after ~15 min idle (first request takes ~50 s). Use `starter` for always-on.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS          # comma-separated; the extension's origin
        value: chrome-extension://gnolicpkknhchlmmfgamghnjcbmpndlf
      - key: AUTH_PASSWORD_ENABLED
        value: "true"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY      # paste the key with literal \n sequences, quotes optional
        sync: false
      - key: FIREBASE_WEB_API_KEY      # Firebase Console > Project settings > General > Web API Key
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID    # OAuth client used for Google sign-in (see DEPLOYMENT.md)
        sync: false
      - key: ANTHROPIC_API_KEY         # Ask MeetMemo AI (Claude). Secret; without it Ask AI reports "not set up"
        sync: false
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: AI_LIVE_MODEL             # live auto-answer model (Claude Haiku)
        value: claude-haiku-5-5
