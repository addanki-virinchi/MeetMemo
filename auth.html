<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MeetMemo</title>
  <link rel="stylesheet" href="auth.css">
  <script src="meetmemo.config.js"></script>
  <script type="module" src="auth.js"></script>
</head>
<body class="popup">
  <header class="bar">
    <img src="logo.svg" alt="" class="logo">
    <span class="brand">MeetMemo</span>
  </header>

  <p id="backend-warning" class="notice notice-error" hidden>
    Can't reach the MeetMemo server at <code id="api-url"></code>. If it was idle it may still be
    waking up; try again in a minute.
  </p>

  <main>
    <section id="view-loading" class="muted">Loading…</section>

    <section id="view-signed-out" hidden>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-signin" aria-selected="true">Sign in</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Create account</button>
      </div>

      <button type="button" id="google-signin" class="google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
        Continue with Google
      </button>
      <p class="muted small divider">or use email</p>

      <form id="auth-form" novalidate>
        <label id="name-field" hidden>Name
          <input name="name" autocomplete="name" maxlength="100">
        </label>
        <label>Email
          <input name="email" type="email" autocomplete="email" required maxlength="254">
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
        </label>
        <p id="form-error" class="notice notice-error" hidden></p>
        <button type="submit" id="submit" class="primary">Sign in</button>
      </form>
    </section>

    <section id="view-signed-in" hidden>
      <div class="account">
        <div>
          <div id="user-name" class="strong"></div>
          <div id="user-email" class="muted small"></div>
        </div>
        <button type="button" id="sign-out" class="link">Sign out</button>
      </div>

      <p id="profile-warning" class="notice notice-error small" hidden>
        <span id="profile-warning-text"></span>
        <button type="button" id="profile-retry" class="link small">Retry</button>
      </p>

      <h2>Live sync</h2>
      <div id="sync-status" class="small"></div>

      <h2>Recent meetings</h2>
      <ul id="meetings" class="meetings"></ul>
      <p id="meetings-empty" class="muted small" hidden>No saved meetings yet.</p>
      <p id="meetings-error" class="notice notice-error small" hidden></p>
      <button type="button" id="meetings-more" class="link small" hidden>Show more</button>
    </section>
  </main>

  <footer class="bar footer">
    <button type="button" id="open-options" class="link small">Extension settings</button>
  </footer>
</body>
</html>
